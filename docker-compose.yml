# User Registration Application – single production-ready Compose file
# Usage:
#   Production (app + db):        docker-compose up -d
#   With MailHog (local dev):     docker-compose --profile dev up -d
#   With Nginx proxy:             docker-compose --profile proxy up -d  (requires ./nginx/)
#   With monitoring:              docker-compose --profile monitoring up -d  (requires ./prometheus/)
#
# First run: ensure DB schema exists. With Flyway, it runs on startup. Otherwise set in .env:
#   SPRING_JPA_HIBERNATE_DDL_AUTO=update  (then switch to validate for production)

version: '3.8'

services:
  app:
    build: .
    container_name: user-registration-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/userdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: false
      SERVER_PORT: 8080
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      APP_EMAIL_FROM_NAME: ${APP_EMAIL_FROM_NAME:-Rhume}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      LOGGING_LEVEL_COM_CODEHACKS_USER_REGISTRATION: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxGCPauseMillis=200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    networks:
      - user-registration-network

  db:
    image: postgres:16.8-alpine
    container_name: user-registration-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - user-registration-network

  # Optional: MailHog for local email testing. Start with: docker-compose --profile dev up -d
  mailhog:
    image: mailhog/mailhog:latest
    container_name: user-registration-mailhog
    profiles:
      - dev
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MH_STORAGE: memory
    restart: unless-stopped
    networks:
      - user-registration-network

  # Optional: Nginx reverse proxy. Requires ./nginx/nginx.conf and ./nginx/ssl. Start with: docker-compose --profile proxy up -d
  nginx:
    image: nginx:alpine
    container_name: user-registration-nginx
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - user-registration-network

  # Optional: Prometheus. Requires ./prometheus/prometheus.yml. Start with: docker-compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: user-registration-prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - user-registration-network

  # Optional: Grafana. Start with: docker-compose --profile monitoring up -d
  grafana:
    image: grafana/grafana:latest
    container_name: user-registration-grafana
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - user-registration-network

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  user-registration-network:
    driver: bridge
